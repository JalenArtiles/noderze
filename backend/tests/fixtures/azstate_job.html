<html><head><script type="application/ld+json">
    {"@context":"https://schema.org/","@type":"JobPosting","title":"Intern","description":"\n\n\n\n\u003cdiv class=\"job-header\"\u003e\n\u003ch1\u003eDEPT OF HEALTH SERVICES\u003c/h1\u003e\n\u003ch2\u003e\u003cem\u003eThe Arizona Department of Health Services promotes and protects the health of Arizona’s children and adults. Our mission is to promote, protect, and improve the health and wellness of individuals and communities in Arizona. We strive to set the standard for personal and community health through direct care, science, public policy, and leadership. ADHS promotes alternative work schedules, flexible hours. We have positions that can fit any stage in your career, from entry to senior level. Come check us out and see how you can make a difference in the lives of all Arizonans.\u003c/em\u003e\u003c/h2\u003e\n\u003c/div\u003e\n\n\n\n\n\u003ch3\u003e\u003cstrong\u003eBUREAU OF RADIATION CONTROL INTERN\u003c/strong\u003e\u003c/h3\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nJob Location:\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003ch4\u003eAddress: 150 N 18th Ave, Phoenix, AZ, 85007\u003c/h4\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nPosting Details:\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003ch4\u003e Hourly Range: $15.40 - $24.20 - Based on experience and education level \u003cbr\u003e\n\u003c/h4\u003e\n\u003ch4\u003eGrade: 4\u003c/h4\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nJob Summary:\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003cp\u003eWe are seeking a talented and engaged intern who is working toward a degree and wants to develop beyond the classroom! At ADHS, we support a diverse, multicultural workforce that reflects the community, promotes equal opportunity at all levels of public employment, and creates an inclusive work environment that enables all individuals to perform to their fullest potential free from discrimination. This includes accessibility and providing accommodations for employees. The BRC intern will join our team for 52 weeks, working 19 hours each week. As soon as you’re ready we can accommodate your class schedule so that you may work during business hours.\u003cbr\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nJob Duties:\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003cp\u003e• In this role, you will learn a variety of licensing and registration modalities; participate in inspections and investigations and assist in issuing licenses and registrations for all forms of ionizing and non-ionizing radiation. \u003cbr\u003e• You will be coached and mentored by the the Bureau Chief, program managers, and/or others on the team by collaborating with them on inspections, investigations, trainings and special Bureau projects.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nKnowledge, Skills \u0026 Abilities (KSAs):\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003cp\u003e• Strong verbal and communication skills.\u003cbr\u003e• Knowledge of science, math or environmental safety concepts.\u003cbr\u003e• Time management, organization, planning and problem solving skills.\u003cbr\u003e• Ability to observe and follow procedures accurately.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nSelective Preference(s):\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003cp\u003eWorking towards a degree in a related field and strong desire to develop beyond the classroom.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nPre-Employment Requirements:\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003cp\u003eEmployees who drive on state business require possession of and the ability to retain a current, valid state-issued driver’s license appropriate to the assignment. Employees who drive on state business are subject to driver’s license checks, must maintain acceptable driving records and must complete any driver training (See Arizona Administrative Code R2-10-207.11).\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eIf this position requires driving or the use of a vehicle as an essential function of the job to conduct State business, then the following requirements apply: \u003ca href=\"https://publicstorage.dc4.pageuppeople.com/1045/ClientPublicFile/3601803f-02e5-4b70-b325-26c8ef309c1b.pdf\" target=\"_blank\"\u003eDriver’s License Requirements.\u003c/a\u003e\u003c/em\u003e\u003cbr\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eAll newly hired State employees are subject to and must successfully complete the Electronic Employment Eligibility Verification Program (E-Verify).\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nBenefits:\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003cp\u003e● Understanding of radiation safety principles and regulations.\u003cbr\u003e● Exposure to regulatory compliance processes.\u003cbr\u003e● Insight into public health and environmental protection\u003cbr\u003e● Collaboration with a diverse team of professionals.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eLearn more about the Paid Parental Leave program \u003ca title=\"Paid Parental Leave Pilot Program\" href=\"https://hr.az.gov/about/resources/family-leave-expansion\" target=\"_blank\"\u003ehere\u003c/a\u003e. For a complete list of benefits provided by The State of Arizona, please visit our \u003ca href=\"https://benefitoptions.az.gov/jobseekers\" target=\"_blank\"\u003ebenefits page\u003c/a\u003e\u003c/em\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003cp\u003e \u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"job-divider\"\u003e\n\n\n\nContact Us:\n\n\n\n\u003c/div\u003e\n\u003cdiv class=\"job-content\"\u003e\n\u003cp\u003eThe State of Arizona is an Equal Opportunity/Reasonable Accommodation Employer. Persons with a disability may request a reasonable accommodation such as a sign language interpreter or an alternative format by emailing Steven.Santiago@azdhs.gov. Requests should be made as early as possible to allow sufficient time to arrange the accommodation. DHS is an Equal Employment Opportunity Employer. All newly hired employees will be subject to E-Verify Employment Eligibility Verification.\u003c/p\u003e\n\u003c/div\u003e","datePosted":"2026-04-17T21:22:35Z","employmentType":"FULL_TIME","validThrough":"2027-01-11T17:05:47Z","hiringOrganization":{"@type":"Organization","name":"State of Arizona","logo":"https://d25wby5c7p9100.cloudfront.net/public/uploads/fe8110a2123244c062774afeb117cafe/companies/logos/fe8110a2123244c062774afeb117cafe/thumb/az-logo-color.png?1600903266"},"identifier":{"@type":"PropertyValue","name":"State of Arizona","value":"afcc886cf0ab504fc69e17773f4658ff"},"directApply":false,"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"","addressLocality":"PHOENIX","addressRegion":"Arizona","postalCode":"","addressCountry":"US"}}]}
